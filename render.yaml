services:
  - type: web
    name: study-catalog-lab7
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: DEPLOYMENT_MODE
        value: Render (PaaS)
      - key: STUDY_CATALOG_SECRET_KEY
        generateValue: true
